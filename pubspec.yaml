name: ollama_easy
description: >-
  Complete Ollama client for Dart and Flutter: streaming chat, tool-calling
  loops, structured outputs, thinking, vision, embeddings, model management,
  cancel tokens, retries.
version: 1.0.0
homepage: https://github.com/developerashkan/ollama_easy
repository: https://github.com/developerashkan/ollama_easy
issue_tracker: https://github.com/developerashkan/ollama_easy/issues
documentation: https://github.com/developerashkan/ollama_easy#readme
topics:
  - ollama
  - llm
  - ai
  - chatbot
  - local-ai

screenshots:
  - description: Flutter example - streaming reply with thinking and tokens per second.
    path: screenshots/chat_light.png
  - description: Flutter example - dark mode while streaming, with the stop button.
    path: screenshots/streaming_dark.png
  - description: Flutter example - empty state with model picker and status.
    path: screenshots/empty_light.png

executables:
  ollama_easy:

platforms:
  android:
  ios:
  linux:
  macos:
  web:
  windows:

environment:
  sdk: ^3.4.0

dependencies:
  http: ^1.5.0

dev_dependencies:
  fake_async: ^1.3.1
  lints: ^5.0.0
  stream_channel: ^2.1.0
  test: ^1.25.0
